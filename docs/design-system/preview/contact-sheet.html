<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SignedChange 2.0 logo family — design reference</title>
<style>
  body { margin: 0; background: #F5F7FA; color: #17324A; font-family: "Noto Sans", Arial, Helvetica, sans-serif; }
  header { padding: 28px 32px 8px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  p { margin: 0; max-width: 760px; line-height: 1.45; }
  .banner { margin: 16px 32px; padding: 10px 14px; background: #FFF6E0; border: 1px solid #8A5A00; border-radius: 8px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 8px 32px 32px; }
  figure { margin: 0; background: #fff; border: 1px solid #D5DEE7; border-radius: 12px; padding: 16px; }
  figure.dark { background: #0E1A27; color: #F4F7FB; }
  img { width: 100%; height: 120px; object-fit: contain; }
  figcaption { margin-top: 8px; font-size: 13px; }
  code { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>SignedChange 2.0 logo family</h1>
  <p>Design reference only. These files live under docs/design-system/logo/ and do not replace site/logo.svg or site/logo.png.</p>
</header>
<p class="banner">Not the live site. Isolated brand artwork for Milestone 3.</p>
<div class="grid">
  <figure><img alt="Primary lockup" src="../logo/primary.svg"><figcaption>Primary — symbol and wordmark. <code>primary.svg</code></figcaption></figure>
  <figure><img alt="Horizontal lockup" src="../logo/horizontal.svg"><figcaption>Horizontal. <code>horizontal.svg</code></figcaption></figure>
  <figure><img alt="Stacked lockup" src="../logo/stacked.svg"><figcaption>Stacked. <code>stacked.svg</code></figcaption></figure>
  <figure><img alt="Symbol" src="../logo/symbol.svg"><figcaption>Symbol only. <code>symbol.svg</code></figcaption></figure>
  <figure><img alt="Monochrome" src="../logo/primary-mono.svg"><figcaption>Monochrome. <code>primary-mono.svg</code> and <code>symbol-mono.svg</code></figcaption></figure>
  <figure><img alt="Favicon" src="../logo/favicon.svg"><figcaption>16–32 px favicon. <code>favicon.svg</code></figcaption></figure>
  <figure class="dark"><img alt="Dark horizontal" src="../logo/horizontal-dark.svg"><figcaption>Dark background. <code>horizontal-dark.svg</code></figcaption></figure>
  <figure class="dark"><img alt="Dark stacked" src="../logo/stacked-dark.svg"><figcaption>Dark stacked. <code>stacked-dark.svg</code></figcaption></figure>
</div>
</body>
</html>
