<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; media-src 'self'; connect-src 'self' https://cloudflareinsights.com https://signedchange-unlock.signedchange.workers.dev https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self' https://www.paypal.com; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Review and sign – SignedChange</title>
<meta name="robots" content="noindex">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="sc.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-nav">
  <a class="brand" href="index.html"><img src="brand/horizontal-dark.svg" alt="SignedChange" width="210" height="32"></a>
<div class="prefs"><label class="prefs-label"><span data-i18n="pref.lang">Language</span> <select id="sc-lang" aria-label="Language"><option value="en">English</option><option value="fr">Français</option></select></label><label class="prefs-label"><span data-i18n="pref.theme">Theme</span> <select id="sc-theme" aria-label="Theme"><option value="system" data-i18n="theme.system">System</option><option value="light" data-i18n="theme.light">Light</option><option value="dark" data-i18n="theme.dark">Dark</option></select></label></div></header>
<main id="main" class="wrap narrow section">
<p id="loading" role="status">Loading the agreement…</p>
<section id="review" hidden>
  <article class="sheet">
    <h1 id="dt">Change</h1>
    <p id="cono"></p>
    <dl id="rows" class="rows"></dl>
    <div id="totals" hidden></div>
    <div id="atts"></div>
    <img id="cs" alt="Signature of the person who created this change" hidden>
    <p id="csn"></p>
    <p id="agreetxt" hidden></p>
    <p id="agreeLang" class="help"></p>
  </article>
  <label for="name">Your full name</label>
  <input id="name" maxlength="120" autocomplete="name">
  <h2>Your signature</h2>
  <canvas id="sig" class="sig" width="600" height="200" aria-label="Your signature"></canvas>
  <p><button type="button" class="btn secondary" id="clear">Clear</button> <button type="button" class="btn secondary" id="typeSig">Type my name instead</button></p>
  <label for="agree"><input type="checkbox" id="agree"> <span id="agreeL">I agree to the statement above and sign this change electronically.</span></label>
  <p id="msg" class="ferr" role="alert"></p>
  <p><button type="button" class="btn primary" id="sign">Sign and agree</button></p>
  <details id="declineBox">
    <summary>Decline instead</summary>
    <label for="reason">What should change</label>
    <textarea id="reason" maxlength="500"></textarea>
    <p id="dmsg" class="ferr" role="alert"></p>
    <button type="button" class="btn danger" id="decline">Decline and send my reason</button>
  </details>
  <p class="small">Link valid until <span id="exp"></span>.</p>
</section>
<section id="declined" hidden>
  <h1>Declined</h1>
  <p>Your reason was sent. This link is finished.</p>
</section>
<section id="done" hidden>
  <h1>Signed</h1>
  <p>Keep this page. The view link in the address bar is how you download the PDF later. It is not emailed.</p>
  <button type="button" class="btn primary" id="dl">Download signed PDF</button>
</section>
<section id="err" hidden>
  <h1>This link</h1>
  <p id="errm" role="alert"></p>
  <button type="button" class="btn secondary" id="retryGet" hidden>Try again</button>
</section>
</main>
<script src="theme.js"></script>
<script src="controls.js"></script>
<script src="i18n/messages.js"></script>
<script src="i18n.js"></script>
<script src="sign.js"></script>
</body>
</html>
